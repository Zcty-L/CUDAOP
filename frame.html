<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: #fff; padding: 20px; }
        .matrix-container { display: flex; flex-direction: column; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(16, 40px); gap: 2px; background: #333; padding: 5px; border-radius: 4px; }
        .cell { width: 40px; height: 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 10px; border-radius: 2px; cursor: pointer; transition: transform 0.1s; }
        .cell:hover { transform: scale(1.1); z-index: 10; border: 1px solid #fff; }
        .header { margin-bottom: 20px; text-align: center; }
        .legend { margin-top: 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; font-size: 12px; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .color-box { width: 15px; height: 15px; border-radius: 2px; }
        h2 { color: #00d1b2; }
        .formula { background: #2d2d2d; padding: 10px; border-radius: 5px; font-family: monospace; margin: 10px 0; border-left: 4px solid #00d1b2; }
    </style>
</head>
<body>
    <div class="matrix-container">
        <div class="header">
            <h2>WGMMA m64n128k16 寄存器映射 (局部 16x16 展示)</h2>
            <p>展示矩阵 C[64][128] 的左上角 16x16 区域。每个格子标注了持有它的 <b>Thread ID (T)</b> 和 <b>Register Index (R)</b>。</p>
            <div class="formula">
                row = 4 * (T % 16) + (R % 4)<br>
                col = 8 * (R / 4) + (T / 16)
            </div>
        </div>
        <div id="grid" class="grid"></div>
        <div class="legend">
            <div class="legend-item"><div class="color-box" style="background: hsl(0, 70%, 50%)"></div><span>Thread Group 0 (T0, 16, 32...)</span></div>
            <div class="legend-item"><div class="color-box" style="background: hsl(45, 70%, 50%)"></div><span>Thread Group 1 (T1, 17, 33...)</span></div>
            <div class="legend-item"><div class="color-box" style="background: hsl(90, 70%, 50%)"></div><span>Thread Group 2 (T2, 18, 34...)</span></div>
            <div class="legend-item"><div class="color-box" style="background: hsl(135, 70%, 50%)"></div><span>Thread Group 3 (T3, 19, 35...)</span></div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        // We show a 16x16 slice of the 64x128 matrix
        for (let r = 0; r < 16; r++) {
            for (let c = 0; c < 16; c++) {
                // To find which T and R own (r, c):
                // row = 4 * (T % 16) + (R % 4)  => T % 16 = r / 4, R % 4 = r % 4
                // col = 8 * (R / 4) + (T / 16)  => T / 16 = c % 8, R / 4 = c / 8 (simplified for first block)
                
                const t_mod_16 = Math.floor(r / 4);
                const r_mod_4 = r % 4;
                const t_div_16 = c % 8;
                const r_div_4 = Math.floor(c / 8);
                
                const T = t_div_16 * 16 + t_mod_16;
                const R = r_div_4 * 4 + r_mod_4;
                
                const cell = document.createElement('div');
                cell.className = 'cell';
                const hue = (T % 16) * (360 / 16);
                cell.style.background = `hsl(${hue}, 60%, 40%)`;
                cell.innerHTML = `<span>T${T}</span><span>R${R}</span>`;
                cell.title = `Matrix Coord: (${r}, ${c})\nThread: ${T}\nRegister: ${R}`;
                grid.appendChild(cell);
            }
        }
    </script>
</body>
</html>
